[package]
name = "philcore-proving"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "philcore_proving"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
bincode = "1.3.3"
cairo-lang-runner = "=2.15.0"
cairo-lang-sierra = "=2.15.0"
cairo-lang-utils = { version = "=2.15.0", features = ["tracing"] }
hex = "0.4.3"
num-traits = "0.2.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
starknet-types-core = { version = "0.2.4", features = ["hash", "prime-bigint", "serde"] }
tiny-keccak = { version = "2.0.2", features = ["keccak"] }
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "76dd75715ce87e2fe2258083480b6228c23bb70b", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "76dd75715ce87e2fe2258083480b6228c23bb70b", package = "stwo-constraint-framework", features = ["prover", "parallel"] }

[dev-dependencies]
test-log = { version = "0.2.18", features = ["trace"] }

[[bin]]
name = "phase34-generate-proof"
path = "src/bin/generate_proof.rs"

[[bin]]
name = "phase34-verify-proof"
path = "src/bin/verify_proof.rs"

[[bin]]
name = "generate-unlock-proof-json"
path = "src/bin/generate_unlock_proof_json.rs"

[[bin]]
name = "verify-unlock-proof-json"
path = "src/bin/verify_unlock_proof_json.rs"

[[bin]]
name = "starknet-syscall-harness"
path = "src/bin/starknet_syscall_harness.rs"

[[bin]]
name = "starknet-l1-relay-harness"
path = "src/bin/starknet_l1_relay_harness.rs"
